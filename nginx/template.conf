js_import csp from /etc/nginx/njs/csp.js;
js_set $csp_nonce csp.generateNonce;

server {
    listen 3000;
    server_name localhost;

    ${REAL_IP_CONFIG}

    # Remove server version etc
    server_tokens off;

    root /var/www/html;
    index index.html index.htm;

    location /config.json {
        include /etc/nginx/snippets/security-headers.conf;

        # Allow top.gg iframe to access config.json
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;

        # Allow top.gg iframe to access assets
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;

        # Assets are content-hashed by Vite
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}