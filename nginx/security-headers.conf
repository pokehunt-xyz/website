# HSTS
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Basic security headers
add_header X-Content-Type-Options "nosniff" always;
# add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content Security Policy
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; script-src-attr 'none'; style-src 'self'; img-src 'self' data: blob: https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/; font-src 'self' data:; connect-src 'self' https://api.pokehunt.xyz https://pokeapi.co/api/v2/pokemon/; object-src 'none'; base-uri 'self'; frame-ancestors https://top.gg; form-action 'self'; frame-src https://challenges.cloudflare.com; media-src 'self'; worker-src 'none'; upgrade-insecure-requests;" always;

# Browser permissions
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Cross-origin policies
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Additional security headers
add_header X-Permitted-Cross-Domain-Policies "none" always;

add_header Server "" always;
add_header X-Powered-By "" always;